org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Инкрементальная компиляция Kotlin выключена: на Windows с junction-путём
# (E:\Projects~\... вместо пути с пробелом) демон не может закрыть .tab-кэши
# и сборка падает «Could not close incremental caches». Плагины
# (shared_preferences_android, url_launcher_android) собираются заново —
# это секунды, зато сборка стабильна и локально, и в CI.
kotlin.incremental=false
